<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de médias fixas</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2>
        Fazer um programa que imprima a média aritmética dos números 8,9 e 7. A média dos
        números 4, 5 e 6. A soma das duas médias. A média das médias.
    </h2>
    <h1>Programa:</h1>
    <script>
        let media1 = (8 + 9 + 7)/3;
        let media2 = (4 + 5 + 6)/3;
        let soma = media1 + media2;
        let mediaFinal = soma/2;

        document.write("A média aritmética dos números 8,9 e 7 é: " + media1);
        document.write("<br />A média aritmética dos números 4, 5 e 6 é: " + media2);
        document.write("<br />A soma dessas médias é: " + soma);
        document.write("<br />A média dessas médias é: " + mediaFinal)

    </script>

</body>
</html>
