<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antecessor e Sucessor</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2>
        Desenvolva um algoritmo em JavaScript que leia um número inteiro e imprima o seu
        antecessor e seu sucessor.
    </h2>
    <h1>Programa:</h1>

    <script>
        
        let numero = parseInt(prompt("Insira um valor inteiro:"))
        let antecessor = numero - 1
        let sucessor = numero + 1


        document.write(`O número escolhido foi: ${numero} <br />O antecessor dele é: ${antecessor}<br />O sucessor dele é: ${sucessor}`)

    </script>

</body>
</html>
