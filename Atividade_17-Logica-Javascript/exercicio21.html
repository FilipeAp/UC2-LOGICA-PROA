<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Mamão com Açúcar</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        A Loja Mamão com Açúcar está vendendo seus produtos em 5 (cinco) prestações sem juros. Faça um programa que receba um valor de uma compra e mostre o valor das prestações.

    </h2>
    <h1>Programa:</h1>

    <script>
        let compra = parseFloat(prompt("Digite o valor da compra:"))

        prestacao = compra/5

        if(isNaN(compra) || compra <= 0){
            document.write("Valor de compra inválido. Por favor, reinicie o programa e tente novamente")
        }else{
            document.write(`As prestações ficaram 5x de R$ ${prestacao.toFixed(2)}`)
        }
        
        

        
        
    </script>

</body>
</html>
