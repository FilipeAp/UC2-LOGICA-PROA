<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números entre 0 e 100, 101 e 200 e maiores que 200</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        Faça um programa que leia 20 números e, ao final, escreva quantos estão entre 0 e 100, quantos estão entre 101 e 200 e quantos são maiores de 200.
    </h2>
    <h1>Programa:</h1>

    <script>
        let parcela1 = 0
        let parcela2 = 0
        let parcela3 = 0

        for (let i = 1; i <= 20; i++) {
            let numero = parseFloat(prompt(`Digite o ${i}° número:`))
            if(numero >= 0 && numero <= 100){
                parcela1 = parcela1 + 1
            }else if(numero >= 101 && numero <= 200){
                parcela2 = parcela2 + 1
            }else if(numero > 200){
                parcela3 = parcela3 + 1
            }
        }
        
        document.write(`A quantidade de números entre 0 e 100 é: ${parcela1}`)
        document.write(`<br />A quantidade de números entre 101 e 200 é: ${parcela2}`)
        document.write(`<br />A quantidade de números maiores que 200 é: ${parcela3}`)

        
        
    </script>

</body>
</html>
