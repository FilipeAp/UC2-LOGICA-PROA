<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pessoas maiores de idade</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        Escreva um programa que leia a idade de 20 pessoas e exiba quantas pessoas são maiores de idade. 
    </h2>
    <h1>Programa:</h1>

    <script>
        let maiores = 0

        for (let i = 1; i <= 20; i++) {
            let idade = parseInt(prompt(`Digite a idade da ${i}° pessoa:`))
            if(idade >= 18){
                maiores = maiores +1
            }
        }
        
        document.write(`A quantidade de pessoas maiores de idade é: ${maiores}`)

        
        
    </script>

</body>
</html>
