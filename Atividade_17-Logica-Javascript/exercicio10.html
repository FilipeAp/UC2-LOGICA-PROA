<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reajuste de saldo de 1.5%</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        Informar um saldo e mostrar na tela o saldo com reajuste de 1.5%.
    </h2>
    <h1>Programa:</h1>
    <script>

        let saldo = parseFloat(prompt("Insira seu saldo:"))


        if(isNaN(saldo)){
            document.write("Valor invalido")
        }else if(saldo <= 0){
            document.write(`O saldo original é de: R$ ${saldo.toFixed(2)}`)
            document.write(`<br />E não sofrerá reajuste`)
        }else{
            let novoSaldo = (0.015 * saldo) + saldo;
            document.write(`O saldo original é de: R$ ${saldo.toFixed(2)}`)
            document.write(`<br />O saldo com o reajuste de 1.5% é de: R$ ${novoSaldo.toFixed(2)}`)
        }

    </script>
</body>
</html>
