<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma de 1 a 15</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        Escreva um programa que calcule a soma dos números de 1 a 15.  
    </h2>
    <h1>Programa:</h1>

    <script>

        const somatoria = (15*(15+1))/2

        document.write("A somatoria dos valores de 1 a 15 é: " + somatoria)
        
    </script>

</body>
</html>
