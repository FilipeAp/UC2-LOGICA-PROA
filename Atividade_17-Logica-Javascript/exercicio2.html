<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analista de números</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2>
        Escreva um programa em Javascript, que leia um número e informe se ele é divisível por 10, por 5 ou por 2 ou se não é divisível por nenhum deles.
    </h2>
    <h1>Programa:</h1>

    <script>

        let num = parseFloat(prompt("Insira um número para comparação:"));

        if (isNaN(num)) {
            document.write("Valor inválido");
        }else if (num % 10 === 0) {
            document.write(`O número ${num} é divisível por 10`);
        } else if (num % 5 === 0) {
            document.write(`O número ${num} é divisível por 5`);
        } else if (num % 2 === 0) {
            document.write(`O número ${num} é divisível por 2`);
        } else {
            document.write(`O número ${num} não é divisível por 10, 5 ou 2`);
        }

    </script>
</body>
</html>
