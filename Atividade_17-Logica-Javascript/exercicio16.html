<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média de 20 idades</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        Escreva um programa que leia a idade de 20 pessoas e exiba a média das idades.  
    </h2>
    <h1>Programa:</h1>

    <script>

        let idade1 = parseInt(prompt("Digite a idade da primeira pessoa:"))
        let idade2 = parseInt(prompt("Digite a idade da segunda pessoa:"))
        let idade3 = parseInt(prompt("Digite a idade da terceira pessoa:"))
        let idade4 = parseInt(prompt("Digite a idade da quarta pessoa:"))
        let idade5 = parseInt(prompt("Digite a idade da quinta pessoa:"))
        let idade6 = parseInt(prompt("Digite a idade da sexta pessoa:"))
        let idade7 = parseInt(prompt("Digite a idade da sétima pessoa:"))
        let idade8 = parseInt(prompt("Digite a idade da oitava pessoa:"))
        let idade9 = parseInt(prompt("Digite a idade da nona pessoa:"))
        let idade10 = parseInt(prompt("Digite a idade da décima pessoa:"))
        let idade11 = parseInt(prompt("Digite a idade da décima primeira pessoa:"))
        let idade12 = parseInt(prompt("Digite a idade da décima segunda pessoa:"))
        let idade13 = parseInt(prompt("Digite a idade da décima terceira pessoa:"))
        let idade14 = parseInt(prompt("Digite a idade da décima quarta pessoa:"))
        let idade15 = parseInt(prompt("Digite a idade da décima quinta pessoa:"))
        let idade16 = parseInt(prompt("Digite a idade da décima sexta pessoa:"))
        let idade17 = parseInt(prompt("Digite a idade da décima sétima pessoa:"))
        let idade18 = parseInt(prompt("Digite a idade da décima oitava pessoa:"))
        let idade19 = parseInt(prompt("Digite a idade da décima nona pessoa:"))
        let idade20 = parseInt(prompt("Digite a idade da vigésima pessoa:"))

        let soma = idade1 + idade2 + idade3 + idade4 + idade5 + idade6 + idade7 + idade8 + idade9 + idade10 + idade11 + idade12 + idade13 + idade14 + idade15 + idade16 + idade17 + idade18 + idade19 + idade20;

        let media = soma / 20;

        if(isNaN(soma)){
            alert("Alguma das idades é inválida")
            document.write("Alguma das idades é inválida, reinicie o programa e tente novamente")
        }else{
            document.write(`A média das idades é: ${media}`);
        }
        
    </script>

</body>
</html>
