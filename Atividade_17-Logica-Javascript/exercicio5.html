<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificador de classe eleitoral</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2>
        Crie um programa em javascript que leia a idade de uma pessoa e informe a sua classe eleitoral: 
        <br />∙ não eleitor (abaixo de 16 anos); 
        <br />∙ eleitor obrigatório (entre a faixa de 18 e menor de 65 anos);
        <br />∙ eleitor facultativo (de 16 até 18 anos e maior de 65 anos, inclusive).

    </h2>

    <script>
        let idade = parseInt(prompt("Insira sua idade:"))

        if(idade < 16 && idade >= 0){
            alert("Você não é eleitor")
        }else if (idade >= 18 && idade <= 65){
            alert("Você é um eleitor obrigatório")
        }else if((idade >= 16 && idade < 18) || (idade > 65 && idade < 140)){
            alert("Você é um eleitor facultativo")
        }else{
            alert("Idade invalida")
        }
    </script>

</body>
</html>
