<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informante de calorias</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        Criar um programa em Javascript, que informe a quantidade total de calorias de uma refeição a partir do usuário que deverá informar o prato, a sobremesa e a bebida (veja a tabela a seguir). 
    </h2>
    <img src="./Imagens/cardapio.png" alt="Imagem de um cardápio com as calorias">
    <h1>Programa:</h1>

    <script>

        let prato = parseInt(prompt("Informe uma opção de prato de 1 a 4:\n 1 - vegetariano, 2 – Peixe, 3 – Frango, 4 – Carne.\n *Digite apenas o número"))
        let sobremesa = parseInt(prompt("Informe uma opção de sobremesa de 1 a 4:\n 1 - Abacaxi, 2 – Sorvet diet, 3 – Mouse diet, 4 – Mouse de chocolate.\n *Digite apenas o número"))
        let bebida = parseInt(prompt("Informe uma opção de bebida de 1 a 4:\n 1 - Chá, 2 – Suco de Laranja, 3 – Suco de Melão, 4 – Refrigerante diet.\n *Digite apenas o número"))
        let caloriasTotais = 0

        switch(prato){
            case 1: prato = "Prato escolhido: Vegetariano"
            caloriasTotais = caloriasTotais + 180
            break

            case 2: prato = "Prato escolhido: Peixe"
            caloriasTotais = caloriasTotais + 230
            break

            case 3: prato = "Prato escolhido: Frango"
            caloriasTotais = caloriasTotais + 250
            break

            case 4: prato = "Prato escolhido: Carne"
            caloriasTotais = caloriasTotais + 350
            break

            default: prato = "Prato não selecionado"
        }

        document.write(prato)

        switch(sobremesa){
            case 1: sobremesa = "<br />Sobremesa escolhida: Abacaxi"
            caloriasTotais = caloriasTotais + 75
            break

            case 2: sobremesa = "<br />Sobremesa escolhida: Sorvet diet"
            caloriasTotais = caloriasTotais + 110
            break

            case 3: sobremesa = "<br />Sobremesa escolhida: Mouse diet"
            caloriasTotais = caloriasTotais + 170
            break

            case 4: sobremesa = "<br />Sobremesa escolhida: Mouse de chocolate"
            caloriasTotais = caloriasTotais + 200
            break

            default: sobremesa = "<br />Sobremesa não selecionada"

        }

        document.write(sobremesa)

        switch(bebida){
            case 1: bebida = "<br />Bebida escolhida: Chá"
            caloriasTotais = caloriasTotais + 20
            break

            case 2: bebida = "<br />Bebida escolhida: Suco de laranja"
            caloriasTotais = caloriasTotais + 70
            break
            
            case 3: bebida = "<br />Bebida escolhida: Suco de melão"
            caloriasTotais = caloriasTotais + 100
            break

            case 4: bebida = "<br />Bebida escolhida: Refrigerante diet"
            caloriasTotais = caloriasTotais + 65
            break

            default: bebida = "<br />Bebida não selecionada"
        }
        document.write(bebida)
        document.write(`<br />Total de calorias: ${caloriasTotais} cal`)

    </script>

</body>
</html>
