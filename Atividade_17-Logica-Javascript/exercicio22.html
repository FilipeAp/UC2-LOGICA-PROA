<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números entre 0 e 100</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        Faça um programa que leia 20 números e, ao final, escreva quantos estão entre 0 e 100.  
    </h2>
    <h1>Programa:</h1>

    <script>
        let entre = 0

        for (let i = 1; i <= 20; i++) {
            let numero = parseFloat(prompt(`Digite o ${i}° número:`))
            if(numero > 0 && numero < 100){
                entre = entre + 1
            }
        }
        
        document.write(`A quantidade de números entre 0 e 100 é: ${entre}`)

        
        
    </script>

</body>
</html>
