<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Graus Celsius para Graus Fahrenheit</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        Ler uma temperatura em graus Celsius e apresentá-la convertida em graus Fahrenheit. A fórmula de conversão é: F=(9*C+160) / 5, sendo F a temperatura em Fahrenheit e C a temperatura em Celsius.  
    </h2>
    <h1>Programa:</h1>

    <script>

        let celsius = parseFloat(prompt("Digite a temperatura em Celsius:"))

        let fahrenheit = (9*celsius+160)/5

        if(isNaN(celsius)){
            alert("Valor atribuido a graus Celsius inválido")
        }else{
        document.write(`Temperatura em Celsius: ${celsius} °C <br />Temperatura em Fahrenheit: ${fahrenheit} °F`)
        }
        
    </script>

</body>
</html>
