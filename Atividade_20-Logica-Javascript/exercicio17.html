<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma de 1 a 100</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Escreva um programa que calcule a soma dos números de 1 a 100 usando o loop "do-while".
    </h2>
    <h1>Programa:</h1>

    <script>
        
        let i = 1;
        let soma = 0;

        do {
            soma = soma + i;
            i++;
        } while (i <= 100);

        document.write(`A soma dos números de 1 a 100 é: ${soma}`);
        
    </script>
    
</body>
</html>
