<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma dos pares até X</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Escreva um programa que leia um número inteiro e exiba a soma de todos os números pares entre 1 e o número lido.
    </h2>
    <h1>Programa:</h1>

    <script>
        let numero = parseInt(prompt("Insira um número para consultar a soma de todos os números pares entre 1 e ele:"));
        let total = 0;

        for(let i = 1; i <= numero; i++){
            if((i % 2) === 0){
                total = total + i;
            }
        }
        document.write(`A soma dos números pares entre 1 e ${numero} é: ${total}`)
    </script>
    
</body>
</html>
