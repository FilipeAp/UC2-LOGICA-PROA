<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pares de 1 a 50</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Crie um programa que exiba os números pares de 1 a 50.
    </h2>
    <h1>Programa:</h1>

    <script>
        for(let i = 1; i <= 50; i++){
            if(i % 2 === 0){
                document.write(`${i} <br />`)
            }
        }
    </script>
    
</body>
</html>
