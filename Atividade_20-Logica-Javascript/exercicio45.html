<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média de idades até "fim"</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Crie um programa que leia o nome e a idade de várias pessoas até que o nome "fim" seja informado. Ao final, exiba a média das idades.
    </h2>
    <h1>Programa:</h1>

    <script>
        let nome;
        let somaIdades = 0;
        let quantidade = 0;

        for(; nome != "fim";){
            nome = prompt("Digite o nome da pessoa (ou 'fim' para encerrar):");

            if(nome != "fim"){
                let idade = parseInt(prompt("Digite a idade:"));

                somaIdades = somaIdades + idade;
                quantidade++;
            }
        }

        let media = somaIdades / quantidade;

        document.write(`A média das idades é: ${media}`);
    </script>
    
</body>
</html>
