<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dígitos de X</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Faça um programa que leia um número inteiro e exiba os seus dígitos separadamente usando o loop "do-while".
    </h2>
    <h1>Programa:</h1>

    <script>
        let numero = parseInt(prompt("Digite um número para separa-lo:"));
        let transformString = numero.toString();
        let i = 0;

        do {
            document.write(transformString[i] + "<br>");
            i++;
        } while(i < transformString.length)

    </script>
    
</body>
</html>
