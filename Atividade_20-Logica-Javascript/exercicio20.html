<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada de X</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Escreva um programa que leia um número inteiro e exiba a tabuada desse número até o décimo valor usando o loop "do-while".
    </h2>
    <h1>Programa:</h1>

    <script>
        let multiplicador = 1;
        let multiplicado = parseInt(prompt("Insira um número para criar tabuada:"))

        do {
            document.write(`${multiplicador} x ${multiplicado} = ${multiplicador * multiplicado} <br />`)
            multiplicador++;
        } while(multiplicador <= 10)
        
    </script>
    
</body>
</html>
