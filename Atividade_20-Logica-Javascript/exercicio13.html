<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitos separadamente</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Faça um programa que leia um número inteiro e exiba os seus dígitos separadamente usando o loop "while".
    </h2>
    <h1>Programa:</h1>

    <script>
        
        let numero = parseInt(prompt("Digite um número para separa-lo:"));
        let transformString = numero.toString();

        let i = 0;

        while (i < transformString.length) {
            document.write(transformString[i] + "<br>");
            i++;
        }
        
        
    </script>
    
</body>
</html>
