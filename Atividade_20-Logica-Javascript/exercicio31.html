<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De 1 a 10</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Faça um programa que exiba os números de 1 a 10.
    </h2>
    <h1>Programa:</h1>

    <script>
        for(let num = 1; num <= 9; num++){
            document.write(`${num}, `)
        }
        document.write(10)
    </script>
    
</body>
</html>
