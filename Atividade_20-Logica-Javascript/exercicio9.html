<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média de 5 idades</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Crie um programa que leia o nome e a idade de 5 pessoas usando o loop "while" e exiba a média das idades.
    </h2>
    <h1>Programa:</h1>

    <script>
        let idade = 0;
        let i = 1;
        let media =0;
        let nome;
        while(i <= 5){
            nome = prompt(`Digite o nome da ${i}° pessoa:`)
            idade = parseInt(prompt(`Digite a idade da ${i}° pessoa:`))
            media = media + idade;
            i++;
        }
        media = media/5;
        document.write(`A média das 5 idades informadas é:<br /> ${media}`)
        
    </script>
    
</body>
</html>
