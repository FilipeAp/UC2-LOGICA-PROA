<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma dos pares até X</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Escreva um programa que leia um número inteiro e exiba a soma de todos os números pares entre 1 e o número lido usando o loop "do-while".
    </h2>
    <h1>Programa:</h1>

    <script>
        let numero = parseInt(prompt("Insira um número para calcular a soma dos pares até ele:"))
        let i = 1;
        let total = 0;

        do {
            if(i % 2 === 0){
                total = total + i;
            }
            i++;
        } while(i <= numero)

        document.write(`A soma dos números pares entre 1 e ${numero} é:<br /> ${total}`)
        
    </script>
    
</body>
</html>
