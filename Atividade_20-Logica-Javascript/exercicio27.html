<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ímpares de 1 a 50</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2> 
        Crie um programa que exiba os números ímpares de 1 a 50 usando o loop "do-while".
    </h2>
    <h1>Programa:</h1>

    <script>
        let i = 1;

        do {
            if(i % 2 !== 0){
                document.write(`${i} <br />`)
            }
            i++;
        } while(i <= 50)
        
    </script>
    
</body>
</html>
