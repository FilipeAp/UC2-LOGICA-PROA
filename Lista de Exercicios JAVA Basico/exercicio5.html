<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de salários mínimos</title>
</head>
<body>
    
    <h1>Questão:</h1>
    <h2>
        Crie um algoritmo que leia o valor do salário mínimo e o valor do salário de um usuário,
        calcule a quantidade de salários mínimos esse usuário ganha e imprima o resultado.
        (1SM=R$788,00)
    </h2>
    <h1>Programa:</h1>

    <script>

        const salarioMinimo = 788.00

        let salarioUsuario = parseFloat(prompt("Insira seu salário:"))

        let quantidadeSalarioUsiario = salarioUsuario/salarioMinimo

        document.write(`Seu salário: R$ ${salarioUsuario.toFixed(2)} <br />Salário mínimo: R$ ${salarioMinimo.toFixed(2)} <br />Quantidade de salários mínimos que você recebe: ${quantidadeSalarioUsiario.toFixed(2)} Salários mínimos`)

    </script>
</body>
</html>
