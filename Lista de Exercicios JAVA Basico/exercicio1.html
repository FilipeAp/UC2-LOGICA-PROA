<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra sua idade em dias</title>
</head>
<body>
    <h1>Questão:</h1>
    <h2>
        Faça um algoritmo que leia a idade de uma pessoa expressa em anos, meses e dias e
        mostre-a expressa em dias. Leve em consideração o ano com 365 dias e o mês com 30.
        (Ex: 3 anos, 2 meses e 15 dias = 1170 dias.)
    </h2>
    <h1>Programa:</h1>
    <script>

        let idade_anos = parseInt(prompt("Quantos anos completos você tem?"));
        let idade_meses = parseInt(prompt("Além desses anos, quantos meses já se passaram desde seu último aniversário?"));
        let idade_dias = parseInt(prompt("Além desses meses, quantos dias já se passaram desde o último mês completo?"));

        document.write(`Você tem: ${idade_anos} anos, ${idade_meses} meses e ${idade_dias} dias de idade = `)

        idade_dias = idade_dias + (idade_anos*365) + (idade_meses*30);

        document.write(idade_dias + " dias de idade")


    </script>
</body>
</html>
