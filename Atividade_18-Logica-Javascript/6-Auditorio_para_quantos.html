<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 - Auditório para quantos?</title>
</head>
<body>
    
    <script>
        let nomeUser = prompt("Digite seu nome:");

        let convidados = parseInt(prompt("Qual o número de convidados para o seu evento?"));

        if (isNaN(convidados) || convidados < 0) {
            alert("Número de convidados inválido");
        } else if (convidados > 350) {
            alert("Quantidade de convidados superior à capacidade máxima");
        } else {

            if (convidados <= 220) {

                if (convidados <= 150) {
                    alert("Use o auditório Laranja");
                } else {
                    let cadeirasAdicionais = convidados - 150;
                    alert(`Use o auditório Laranja (inclua mais ${cadeirasAdicionais} cadeiras)`);
                }

            } else {
                alert("Use o auditório Colorado");
            }

            let confirmUserAuditorio = prompt("Gostaria de efetuar a reserva? S/N").toUpperCase();

            if (confirmUser === "S") {
                alert(`${nomeUser}, reserva efetuada com sucesso.`);
            } else {
                alert(`${nomeUser}, reserva não efetuada.`);
            }
        }
    </script>

</body>
</html>
