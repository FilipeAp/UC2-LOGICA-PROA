<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 - Como soletra?</title>
</head>
<body>
    
    <script>
        let nomeHospede;
        let gratuidades = 0;
        let meiaDiaria = 0;
        let idadeHospede = 0;
        let primeiroNome;
        let valorTotal = 0;
        let nomeUser = prompt("Digite seu nome:");
        let diasHospedagem = parseFloat(prompt ("Digite a quantidade de dias de hospedagem:")) ;
        let valorDiaria = parseFloat(prompt ("Digite o valor da diária do hotel:"));
        while(nomeHospede != "PARE"){
        nomeHospede = prompt("Digite o nome do hospede:");
        primeiroNome = nomeHospede.trim().split(" ")[0]; /*.trim()= tira espaços do começo e do final do elemento. .split(" ")[0] cria um array com elementos formados apartir da separação dos nome, ou seja os espaços (" "), e aqui estamos dizendo que primeiroNome recebe o primeiro elemento desse nome [0]*/

            if(nomeHospede != "PARE"){
                idadeHospede = parseInt(prompt("Digite a idade do hospede:"));

                if(idadeHospede <= 6){
                    alert(`${nomeHospede} cadastrada(o) com sucesso. ${primeiroNome} possui gratuidade`);
                    gratuidades = gratuidades + 1

                }else if(idadeHospede > 60){
                    alert(`${nomeHospede} cadastrada(o) com sucesso. ${primeiroNome} paga meia diária`);
                    valorTotal = valorTotal + (valorDiaria/2);
                    meiaDiaria = meiaDiaria + 1

                }else{
                    alert(`${nomeHospede} cadastrada(o) com sucesso.`);
                    valorTotal = valorTotal + valorDiaria
                }
            }
        
        }
        valorTotal = valorTotal*diasHospedagem

        alert(`${nomeUser}, o valor total das hospedagens é: R$${valorTotal.toFixed(2)}; ${gratuidades} gratuidade(s); ${meiaDiaria} meia(s)`);
    </script>

</body>
</html>
