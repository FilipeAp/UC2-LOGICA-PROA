<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 4</title>
</head>
<body>

  <h1>Questão:</h1>
  <h2> Faça um programa que leia 5 números inteiros e exiba quantos deles são pares.</h2>
  <h1>Resolução:</h1>
  <script>
    let pares = 0;
    const numero = [];
    for(let i = 1; i <= 5; i++){
      numero.push(parseInt(prompt(`Digite o ${i}° número:`)))
    }
    numero.forEach(num => {
      if(num % 2 === 0){
        pares = pares + 1;
      }
    })
    document.write(`${pares} dos valores digitados são pares.`)
  </script>

</body>
</html>
