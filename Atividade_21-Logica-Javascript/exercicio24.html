<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 24</title>
</head>
<body>
  <h1>Questão 24:</h1>
  <h2>Crie um programa que leia uma matriz 3x3 de números inteiros e verifique se ela é simétrica (igual à sua transposta).</h2>
  <h1>Resolução:</h1>
  <script>
    const matriz = [];
    for (let i = 0; i < 3; i++) {
      matriz.push([]);
      for (let j = 0; j < 3; j++) {
        matriz[i].push(parseInt(prompt(`Digite o elemento [${i}][${j}]:`)));
      }
    }
 
    let simetrica = true;
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        if (matriz[i][j] !== matriz[j][i]) {
          simetrica = false;
        }
      }
    }
 
    if (simetrica) {
      document.write(`A matriz é simétrica.`);
    } else {
      document.write(`A matriz não é simétrica.`);
    }
  </script>
</body>
</html>
