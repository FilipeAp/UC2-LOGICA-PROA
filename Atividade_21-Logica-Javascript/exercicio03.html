<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 3</title>
</head>
<body>

  <h1>Questão:</h1>
  <h2> Crie um programa que leia 7 números inteiros e exiba a média aritmética dos valores lidos.</h2>
  <h1>Resolução:</h1>
  <script>
    let total = 0;
    const numero = [];
    for(let i = 1; i <= 7; i++){
      numero.push(parseInt(prompt(`Digite o ${i}° número:`)))
    }
    numero.forEach(num => {total = total + num})
    document.write(`A média aritmética dos valores citados é: ${total/7}`)
  </script>

</body>
</html>
