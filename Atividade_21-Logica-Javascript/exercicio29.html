<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 29</title>
</head>
<body>
  <h1>Questão 29:</h1>
  <h2>Escreva um programa que leia uma matriz 3x3 de números inteiros e verifique se ela é uma matriz identidade.</h2>
  <h1>Resolução:</h1>
  <script>
    const matriz = [];
    for (let i = 0; i < 3; i++) {
      matriz.push([]);
      for (let j = 0; j < 3; j++) {
        matriz[i].push(parseInt(prompt(`Digite o elemento [${i}][${j}]:`)));
      }
    }
 
    let identidade = true;
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        if (i === j && matriz[i][j] !== 1) {
          identidade = false;
        }
        if (i !== j && matriz[i][j] !== 0) {
          identidade = false;
        }
      }
    }
 
    if (identidade) {
      document.write(`A matriz é uma matriz identidade.`);
    } else {
      document.write(`A matriz não é uma matriz identidade.`);
    }
  </script>
</body>
</html>
