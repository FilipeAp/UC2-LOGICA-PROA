<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 5</title>
</head>
<body>

  <h1>Questão:</h1>
  <h2> Escreva um programa que leia 5 números inteiros e exiba o maior e o menor valor digitado.</h2>
  <h1>Resolução:</h1>
  <script>

    const numero = [];
    for(let i = 1; i <= 5; i++){
      numero.push(parseInt(prompt(`Digite o ${i}° número:`)))
    }
    let menor = numero[0];
    let maior = numero[0];

    numero.forEach(num => {
      if(num < menor){
        menor = num;
      }else if(num > maior){
        maior = num;
      }
    })
    document.write(`O maior número digitado foi: ${maior} <br /> O menor número digitado foi: ${menor}`)
  </script>

</body>
</html>
