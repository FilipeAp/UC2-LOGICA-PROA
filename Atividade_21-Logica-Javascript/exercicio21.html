<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 21</title>
</head>
<body>
  <h1>Questão 21:</h1>
  <h2>Crie um programa que leia uma matriz 4x4 de números inteiros e exiba a média aritmética dos elementos.</h2>
  <h1>Resolução:</h1>
  <script>
    const matriz = [];
    for (let i = 0; i < 4; i++) {
      matriz.push([]);
      for (let j = 0; j < 4; j++) {
        matriz[i].push(parseInt(prompt(`Digite o elemento [${i}][${j}]:`)));
      }
    }
 
    let soma = 0;
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 4; j++) {
        soma += matriz[i][j];
      }
    }
 
    document.write(`A média aritmética dos elementos da matriz é: ${soma / 16}`);
  </script>
</body>
</html>
