<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 14</title>
</head>
<body>
  <h1>Questão 14:</h1>
  <h2>Escreva um programa que leia 7 números inteiros e exiba apenas os números pares.</h2>
  <h1>Resolução:</h1>
  <script>
    const numero = [];
    for (let i = 1; i <= 7; i++) {
      numero.push(parseInt(prompt(`Digite o ${i}° número:`)));
    }
 
    document.write(`Números pares: `);
    numero.forEach(num => {
      if (num % 2 === 0) {
        document.write(`${num} `);
      }
    });
  </script>
</body>
</html>
