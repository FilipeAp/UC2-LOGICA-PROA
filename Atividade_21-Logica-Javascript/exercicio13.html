<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 13</title>
</head>
<body>
  <h1>Questão 13:</h1>
  <h2>Faça um programa que leia 10 números inteiros e exiba quantos deles estão no intervalo de 10 a 50.</h2>
  <h1>Resolução:</h1>
  <script>
    const numero = [];
    for (let i = 1; i <= 10; i++) {
      numero.push(parseInt(prompt(`Digite o ${i}° número:`)));
    }
 
    let contador = 0;
 
    numero.forEach(num => {
      if (num >= 10 && num <= 50) {
        contador++;
      }
    });
 
    document.write(`${contador} números estão no intervalo de 10 a 50.`);
  </script>
</body>
</html>
