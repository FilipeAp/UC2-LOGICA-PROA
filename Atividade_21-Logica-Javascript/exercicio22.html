<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 22</title>
</head>
<body>
  <h1>Questão 22:</h1>
  <h2>Faça um programa que leia duas matrizes 2x2 de números inteiros e exiba o produto entre elas.</h2>
  <h1>Resolução:</h1>
  <script>
    const matrizA = [];
    const matrizB = [];
 
    for (let i = 0; i < 2; i++) {
      matrizA.push([]);
      for (let j = 0; j < 2; j++) {
        matrizA[i].push(parseInt(prompt(`Matriz A - elemento [${i}][${j}]:`)));
      }
    }
 
    for (let i = 0; i < 2; i++) {
      matrizB.push([]);
      for (let j = 0; j < 2; j++) {
        matrizB[i].push(parseInt(prompt(`Matriz B - elemento [${i}][${j}]:`)));
      }
    }
 
    const produto = [[0, 0], [0, 0]];
    for (let i = 0; i < 2; i++) {
      for (let j = 0; j < 2; j++) {
        for (let k = 0; k < 2; k++) {
          produto[i][j] += matrizA[i][k] * matrizB[k][j];
        }
      }
    }
 
    document.write(`Produto das matrizes A x B:<br>`);
    for (let i = 0; i < 2; i++) {
      for (let j = 0; j < 2; j++) {
        document.write(`${produto[i][j]} `);
      }
      document.write(`<br>`);
    }
  </script>
</body>
</html>
