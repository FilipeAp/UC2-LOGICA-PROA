<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 9</title>
</head>
<body>
  <h1>Questão 09:</h1>
  <h2>Crie um programa que leia 10 números inteiros e exiba a quantidade de números positivos e a quantidade de números negativos.</h2>
  <h1>Resolução:</h1>
  <script>
    const numero = [];
    for (let i = 1; i <= 10; i++) {
      numero.push(parseInt(prompt(`Digite o ${i}° número:`)));
    }
 
    let positivos = 0;
    let negativos = 0;
 
    numero.forEach(num => {
      if (num > 0) {
        positivos++;
      } else if (num < 0) {
        negativos++;
      }
    });
 
    document.write(`Quantidade de positivos: ${positivos}<br>`);
    document.write(`Quantidade de negativos: ${negativos}<br>`);
  </script>
</body>
</html>
