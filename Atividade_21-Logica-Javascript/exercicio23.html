<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 23</title>
</head>
<body>
  <h1>Questão 23:</h1>
  <h2>Escreva um programa que leia uma matriz 3x3 de números inteiros e exiba o menor valor presente na matriz.</h2>
  <h1>Resolução:</h1>
  <script>
    const matriz = [];
    for (let i = 0; i < 3; i++) {
      matriz.push([]);
      for (let j = 0; j < 3; j++) {
        matriz[i].push(parseInt(prompt(`Digite o elemento [${i}][${j}]:`)));
      }
    }
 
    let menor = matriz[0][0];
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        if (matriz[i][j] < menor) {
          menor = matriz[i][j];
        }
      }
    }
 
    document.write(`O menor valor da matriz é: ${menor}`);
  </script>
</body>
</html>
