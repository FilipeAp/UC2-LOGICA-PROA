<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 25</title>
</head>
<body>
  <h1>Questão 25:</h1>
  <h2>Faça um programa que leia uma matriz 4x4 de números inteiros e exiba a soma dos elementos de cada coluna.</h2>
  <h1>Resolução:</h1>
  <script>
    const matriz = [];
    for (let i = 0; i < 4; i++) {
      matriz.push([]);
      for (let j = 0; j < 4; j++) {
        matriz[i].push(parseInt(prompt(`Digite o elemento [${i}][${j}]:`)));
      }
    }
 
    for (let j = 0; j < 4; j++) {
      let somaColuna = 0;
      for (let i = 0; i < 4; i++) {
        somaColuna += matriz[i][j];
      }
      document.write(`Soma da coluna ${j}: ${somaColuna}<br>`);
    }
  </script>
</body>
</html>
