<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 28</title>
</head>
<body>
  <h1>Questão 28:</h1>
  <h2>Faça um programa que leia uma matriz 4x4 de números inteiros e exiba o maior valor presente em cada linha.</h2>
  <h1>Resolução:</h1>
  <script>
    const matriz = [];
    for (let i = 0; i < 4; i++) {
      matriz.push([]);
      for (let j = 0; j < 4; j++) {
        matriz[i].push(parseInt(prompt(`Digite o elemento [${i}][${j}]:`)));
      }
    }
 
    for (let i = 0; i < 4; i++) {
      let maiorLinha = matriz[i][0];
      for (let j = 1; j < 4; j++) {
        if (matriz[i][j] > maiorLinha) {
          maiorLinha = matriz[i][j];
        }
      }
      document.write(`Maior valor da linha ${i}: ${maiorLinha}<br>`);
    }
  </script>
</body>
</html>
