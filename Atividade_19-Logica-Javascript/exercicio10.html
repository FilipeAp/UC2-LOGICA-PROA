<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada de 1 a N</title>
</head>
<body>

    <h1>Questão:</h1>
    <h2> 
        Escreva um programa para imprimir todas as tabuadas de 1 a N. N será informado pelo usuário.
    </h2>
    <h1>Programa:</h1>

    <script>
        let N = parseFloat(prompt("Insira um valor para ver a tabuada:"))

        for(let i = 1; i <= N; i++){
            document.write(`Tabuada do ${i}:<br />`)
            
            for(let x = 1; x <= 10; x++){
                document.write(`${x} x ${i} = ${x*i}<br />`)
            }
            x = 0
            document.write("-----------------<br />")
        }
        
        
    </script>
</body>
</html>
