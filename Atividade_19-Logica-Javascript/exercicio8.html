<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valores entre 1 e N</title>
</head>
<body>

    <h1>Questão:</h1>
    <h2> 
        Ler um valor N e imprimir todos os valores inteiros entre 1 (inclusive) e N (inclusive). Considere que o N será sempre maior que ZERO. N  é um valor informado pelo usuário
    </h2>
    <h1>Programa:</h1>

    <script>
        let numero = parseInt(prompt("Insira um número inteiro maior que 0 para a contagem:"))

        while(numero < 1 || isNaN(numero)){
            numero = parseInt(prompt("Número invalido, por favor insira um número inteiro maior que 0 para a contagem:"))
        }
        for(let i = 1; i <= numero; i++){
            document.write(`${i} <br />`)
        }
        
        
    </script>
</body>
</html>
