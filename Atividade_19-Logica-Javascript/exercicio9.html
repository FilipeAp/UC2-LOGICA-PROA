<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 primeiros números maior que 100</title>
</head>
<body>

    <h1>Questão:</h1>
    <h2> 
        Escreva um algoritmo para imprimir os 10 primeiros números inteiros maiores que 100.
    </h2>
    <h1>Programa:</h1>

    <script>

        for(let i = 100; i <= 110; i++){
            document.write(`${i} <br />`)
        }
        
        
    </script>
</body>
</html>
