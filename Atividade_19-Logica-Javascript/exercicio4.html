<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média dos números entre 15 e 100</title>
</head>
<body>

    <h1>Questão:</h1>
    <h2> 
        Faça um algoritmo que calcule e escreva a média aritmética dos números inteiros entre 15 (inclusive) e 100 (inclusive).
    </h2>
    <h1>Programa:</h1>

    <script>
        let contadora = 0
        let soma = 0
        for(let i = 15; i <=100; i++){
            soma = soma + i;
            contadora++
        }
        let media = soma/contadora
        document.write("A média aritmética dos números inteiros entre 15 (inclusive) e 100 (inclusive) é: " + media)
    </script>
</body>
</html>
